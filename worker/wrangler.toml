# 집공고 바깥 방아쇠 — Cloudflare Worker Cron
#
# GitHub 스케줄이 이 저장소에서 발화하지 않아(docs/automation.md 「GitHub 스케줄은 방아쇠로 못 쓴다」)
# 시각을 지키는 일을 GitHub 밖으로 뺐다. Windows 예약 작업이 하던 역할을 PC 없이 대신한다.
#
# 배포:
#   cd worker
#   npx wrangler secret put CRON_TRIGGER_SECRET   # Vercel env와 같은 값
#   npx wrangler deploy
#
# 확인:
#   npx wrangler tail                              # 실행 로그를 실시간으로
#   curl -H "x-cron-secret: <시크릿>" https://zipgonggo-cron.<계정>.workers.dev/

name = "zipgonggo-cron"
main = "src/index.js"
compatibility_date = "2026-09-10"

[vars]
# 때릴 대상. 프리뷰를 겨누고 싶으면 여기만 바꾼다
BASE_URL = "https://zipgonggo.com"

[triggers]
# 10분마다. 라우트가 부를지 말지 스스로 판단하므로 이쪽 정밀도는 필요 없다.
# 무료 플랜 크론 트리거는 횟수 제한이 없고, 하루 144회는 무료 요청 한도(10만/일)에 한참 못 미친다
crons = ["*/10 * * * *"]
