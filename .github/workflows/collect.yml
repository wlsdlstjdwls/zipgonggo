name: 공고 수집

# 매시 목록을 보고, 새 공고가 있을 때만 첨부를 파싱한다.
#
# 두 잡으로 나눈 이유는 무료 한도다. private 저장소 Free는 월 2,000분인데 매시 = 월 730회다.
# 신규가 없는 회차(대부분)는 「감시」에서 끝나 1분을 안 넘긴다. 무거운 의존성(pdfplumber·pyhwp·
# pandas)과 주소 요약DB 내려받기는 신규가 있을 때만 한다.
#
# 준비물은 docs/automation.md 참고. Secrets 5개와 juso-data 릴리스가 있어야 돈다.

on:
  # 스케줄 블록을 뗐다(2026-09-16). GitHub 스케줄은 하루 24회 중 네댓 번만, 그것도 1~2시간 늦게
  # 발화했다(docs/automation.md 「GitHub 스케줄은 방아쇠로 못 쓴다」). 방아쇠는 Vercel Cron 하나다 —
  # web/vercel.json의 crons가 10분마다 /api/cron/collect를 때리고, 라우트가 부를지 말지 판단해 여기를 dispatch한다.
  # 손으로 돌리는 길은 아래 workflow_dispatch와 관리자 콘솔의 「지금 돌리기」가 그대로 갖는다
  workflow_dispatch:
    inputs:
      force:
        description: "신규가 없어도 상세 파싱까지 돌린다"
        type: boolean
        default: false
      slugs:
        description: "이 공고만 파싱 (공백으로 구분). 비우면 이번에 새로 들어온 것"
        type: string
        default: ""

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
  JUSO_SEARCH_API_KEY: ${{ secrets.JUSO_SEARCH_API_KEY }}
  WEB_REVALIDATE_URL: ${{ secrets.WEB_REVALIDATE_URL }}
  REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
  # 한국에서 나가는 구멍(egress/ · pipeline/sources/egress.py). 정부·서울시 사이트가 러너 IP의
  # TCP 연결을 간헐로 안 받아 서울(icn1)을 거친다. 2026-09-16 실측 x-egress-region=icn1.
  #
  # **web(zipgonggo)이 아니라 별도 프로젝트(zipgonggo-egress)다** — web은 Fluid Compute라
  # 함수별 preferredRegion이 안 먹는다(프로젝트 기본 리전 iad1에서 전부 돈다).
  # 끄려면 EGRESS_PROXY_URL을 빈 문자열로 두면 된다. 그러면 예전처럼 직접 나간다
  EGRESS_PROXY_URL: "https://zipgonggo-egress.vercel.app/api"
  EGRESS_SECRET: ${{ secrets.EGRESS_SECRET }}
  # IndexNow 발행 키. **비밀이 아니라 Secret으로 두지 않는다** — 규격이 web/public/{키}.txt 로
  # 공개하라고 요구한다. 값을 바꾸려면 그 파일도 같이 바꿔 재배포해야 한다
  INDEXNOW_KEY: "26b1ed3396f0d701d5f21d04bd0d2801"
  # 남의 서버다. 동시 요청을 걸지 않고 간격을 지킨다(CLAUDE.md 하지 말 것 7)
  SCRAPE_DELAY_SEC: "1.5"
  PYTHONPATH: src
  PYTHONUTF8: "1"

jobs:
  watch:
    name: 감시 — 목록 수집
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    outputs:
      slugs: ${{ steps.s1.outputs.slugs }}
      count: ${{ steps.s1.outputs.count }}
      youth_count: ${{ steps.youth.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements-collect.txt

      - run: pip install -r requirements-collect.txt

      - name: S1 서울주거포털 목록
        id: s1
        run: |
          set -o pipefail
          python -m zipgonggo_pipeline.stages.s1_sh --max-pages 2 > stats.json
          cat stats.json
          echo "slugs=$(jq -c '.new_slugs' stats.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.new_slugs | length' stats.json)" >> "$GITHUB_OUTPUT"

      # 민간임대 축. 목록 JSON에 본문이 실려 와 1쪽(10건, 요청 1회)이면 하루치 새 글을 다 본다.
      # 첨부(PDF)는 상세(ingest) 잡의 s3_youth가 읽는다 — SH slugs와 섞지 않고 신규 건수만 넘긴다
      - name: S1 서울시 청년안심주택 게시판
        id: youth
        if: always()
        run: |
          set -o pipefail
          python -m zipgonggo_pipeline.stages.s1_youth --max-pages 1 > youth.json
          cat youth.json
          echo "count=$(jq '.new_slugs | length' youth.json)" >> "$GITHUB_OUTPUT"

      # 마이홈 API(LH 전국분). 「순찰」에서 옮겨 왔다 — 하루 한 번이면 그 한 번이 실패한 날은
      # 통째로 구멍이다. 실제로 09-13~09-16 사흘이 비었다(2026-09-16 확인).
      #
      # 실패해도 잡을 죽이지 않는다. data.go.kr이 해외 IP(GitHub 러너)의 SYN을 간헐로 안 받아
      # 열 번에 서너 번은 ConnectTimeout으로 끝난다. 매시 두드리면 하루 24번 중 몇 번은 붙고,
      # 실패한 회차는 ingest_log에 ok=false로 남아 콘솔에서 보인다(stages/common.py log_crash).
      # 여기서 빨간불을 켜면 한 시간에 한 번씩 헛경보가 울린다
      - name: S1 마이홈 API
        id: myhome
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          if python -m zipgonggo_pipeline.stages.s1_collect > myhome.json; then
            cat myhome.json
          else
            # 죽은 회차도 {"crashed": …} 한 줄을 남긴다 — 로그에 찍어 둬야 무엇에 막혔는지 보인다
            cat myhome.json || true
            exit 1
          fi

      - name: 요약
        if: always()
        run: |
          {
            echo "## 감시"
            if [ -f stats.json ]; then
              echo "- 신규 **$(jq '.new_slugs | length' stats.json)건** / 갱신 $(jq '.updated' stats.json)건"
              jq -r '.new_slugs[] | "  - `\(.)`"' stats.json
              jq -e '.errors | length > 0' stats.json >/dev/null \
                && jq -r '"- 오류\n```\n" + (.errors | join("\n")) + "\n```"' stats.json || true
            else
              echo "- 목록 수집이 실패했다"
            fi
            if [ -f youth.json ]; then
              echo "- 청년안심주택(민간임대) — 신규 **$(jq '.new_slugs | length' youth.json)건** / 갱신 $(jq '.updated' youth.json)건"
              jq -r '.new_slugs[] | "  - `\(.)`"' youth.json
            else
              echo "- 청년안심주택 목록 수집이 실패했다"
            fi
            if [ "${{ steps.myhome.outcome }}" = "success" ]; then
              echo "- 마이홈 API(LH 전국) — 신규 **$(jq '.inserted' myhome.json)건** / 갱신 $(jq '.updated' myhome.json)건"
            else
              echo "- 마이홈 API **못 붙었다** (data.go.kr이 해외 IP를 간헐로 막는다 — 다음 회차가 이어받는다)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ingest:
    name: 상세 — 첨부 파싱과 좌표
    needs: watch
    # 빈 문자열(jq가 헛돈 회차)을 「신규 있음」으로 읽지 않게 숫자로 견준다
    if: ${{ fromJSON(needs.watch.outputs.count || '0') > 0 || fromJSON(needs.watch.outputs.youth_count || '0') > 0 || inputs.force }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r requirements.txt

      - name: 주소 요약DB 내려받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/juso
          gh release download juso-data --pattern 'entrance-capital.sqlite.gz' --clobber --dir data/juso
          gunzip -f data/juso/entrance-capital.sqlite.gz
          ls -la data/juso

      - name: S3 첨부 공고문 파싱
        id: s3
        run: |
          SLUGS='${{ inputs.slugs }}'
          if [ -z "$SLUGS" ]; then
            SLUGS=$(echo '${{ needs.watch.outputs.slugs }}' | jq -r '.[]')
          fi
          echo "## 상세" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for slug in $SLUGS; do
            echo "::group::$slug"
            if python -m zipgonggo_pipeline.stages.s3_sh_complex --slug "$slug" > "s3-$slug.json"; then
              cat "s3-$slug.json"
              jq -r --arg s "$slug" \
                '"- `\($s)` 단지 \(.inserted + .updated)건" + (if (.skipped | length) > 0 then " (건너뜀 \(.skipped))" else "" end)' \
                "s3-$slug.json" >> "$GITHUB_STEP_SUMMARY"
            else
              cat "s3-$slug.json" || true
              echo "- \`$slug\` **파싱 실패**" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            echo "::endgroup::"
          done
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

      # 민간임대 첨부 PDF — 아직 공급현황이 없는 공고만(기본 선택) 최신 20건. 표 없는 첨부는 no_table로 남고 다음 회차에 또 본다
      - name: S3 청년안심주택 첨부 공고문
        run: |
          set -o pipefail
          python -m zipgonggo_pipeline.stages.s3_youth --limit 20 > s3-youth.json
          cat s3-youth.json
          jq -r '"- 청년안심주택 첨부 — 공고 \(.updated)건 / 줄 \(.inserted)건" + (if (.skipped | length) > 0 then " (건너뜀 \(.skipped))" else "" end)' s3-youth.json >> "$GITHUB_STEP_SUMMARY"

      # 같은 공고가 기관 seq 여러 개로 들어온다 — 정본을 하나 정해 목록·사이트맵에서 겹치지 않게 한다.
      # URL은 지우지 않는다(CLAUDE.md 하지 말 것 6)
      - name: S2 중복 공고 정본 묶기
        run: |
          set -o pipefail
          python -m zipgonggo_pipeline.stages.s2_dedupe > s2.json
          cat s2.json
          jq -r '"- 정본 묶음 \(.groups)건 / 딸림 표시 \(.updated)건"' s2.json >> "$GITHUB_STEP_SUMMARY"

      # --juso-api: 지번으로만 적힌 소재지를 검색 API로 표준화해 다시 맞춘다.
      # 좌표는 그래도 요약DB에서만 나온다 — API는 도로명코드만 준다(CLAUDE.md 하지 말 것 1)
      - name: S6 주소-좌표 조인
        run: |
          set -o pipefail
          python -m zipgonggo_pipeline.stages.s6_geocode --db data/juso/entrance-capital.sqlite --juso-api > s6.json
          cat s6.json
          jq -r '"- 좌표 \(.updated)건 채움 / 못 맞춤 \(.skipped | to_entries | map(.value) | add // 0)건"' s6.json \
            >> "$GITHUB_STEP_SUMMARY"

      # 첨부를 못 읽어도 목록은 이미 들어가 있다 — 조용히 빈 상세 페이지가 생기는 게 제일 위험하다.
      # 사람이 볼 자리를 만든다 — 양식이 처음 보는 공고면 여기가 울린다.
      - name: 실패하면 이슈
        if: failure() || steps.s3.outputs.fail == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "수집 실패 — $(date -u +%Y-%m-%d\ %H:%M)Z" \
            --label "수집" \
            --body "신규 ${{ needs.watch.outputs.count }}건 중 일부가 파싱되지 않았다. $RUN" \
            || echo "이슈 생성 실패(라벨 없음?) — 무시"
          # 이슈를 연 회차는 실행도 빨간불로 끝낸다. 초록불만 보고 「잘 돌고 있다」고
          # 읽는 일을 막는다(2026-09-16)
          exit 1
