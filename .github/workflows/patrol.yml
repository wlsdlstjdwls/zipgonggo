name: 게시판 순찰

# 매시 도는 「공고 수집」이 안 보는 곳을 하루 한 번 훑는다.
#
# 서울주거포털 목록(s1_sh)에 안 올라오는 물건이 있다. 운영기관 위탁분(특화형 매입임대·사회주택)은
# 인터넷청약시스템 게시판(m_247)에만 뜨고, 모집공고 게시판(m_241)에도 포털이 놓친 게 섞인다.
# 경쟁률 결과 글과 마이홈 API(LH 전국분)도 여기서 받는다.
#
# 매시가 아니라 하루 한 번인 이유는 요청 간격이다. m_247은 잡글이 8천 건 섞인 게시판이라
# 한 회차에 수십 번을 두드린다(CLAUDE.md 「하지 말 것」 7).
#
# 게시판에서 새 공고가 나오면 상세 파싱은 「공고 수집」에 넘긴다 — 상세 로직을 두 벌 두지 않는다.

on:
  schedule:
    # UTC 21:40 = KST 06:40. 매시 잡(:17)과 겹치지 않게 비켜 둔다
    - cron: "40 21 * * *"
  workflow_dispatch:
    inputs:
      since_year:
        description: "이 해부터만 본다. 비우면 올해(KST)"
        type: string
        default: ""
      skip_results:
        description: "경쟁률 결과 글 파싱을 건너뛴다"
        type: boolean
        default: false

concurrency:
  group: patrol
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write   # 「공고 수집」을 slugs와 함께 부른다

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
  JUSO_SEARCH_API_KEY: ${{ secrets.JUSO_SEARCH_API_KEY }}
  WEB_REVALIDATE_URL: ${{ secrets.WEB_REVALIDATE_URL }}
  REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
  # 남의 서버다. 동시 요청을 걸지 않고 간격을 지킨다(CLAUDE.md 하지 말 것 7)
  SCRAPE_DELAY_SEC: "1.5"
  PYTHONPATH: src
  PYTHONUTF8: "1"

jobs:
  board:
    name: 순찰 — 게시판과 마이홈 API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    outputs:
      slugs: ${{ steps.p.outputs.slugs }}
      fail: ${{ steps.p.outputs.fail }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements-collect.txt

      # 목록만 받는다 — 첨부를 안 읽으니 경량 묶음이면 된다
      - run: pip install -r requirements-collect.txt

      - name: 게시판 두 곳과 마이홈 API
        id: p
        run: |
          SINCE="${{ inputs.since_year }}"
          if [ -z "$SINCE" ]; then SINCE=$(TZ=Asia/Seoul date +%Y); fi
          fail=0
          echo "## 순찰 ($SINCE년 이후)" >> "$GITHUB_STEP_SUMMARY"

          # m_247은 앞 3쪽이 기본값. m_241은 기본이 60쪽이라 순찰용으로 줄인다
          for spec in "247:--board 247" "241:--board 241 --max-pages 3"; do
            key=${spec%%:*}
            args=${spec#*:}
            echo "::group::m_$key 게시판"
            if python -m zipgonggo_pipeline.stages.s1_ish_board $args --since-year "$SINCE" > "board-$key.json"; then
              cat "board-$key.json"
              jq -r --arg k "$key" '"- m_\($k) 게시판 — 신규 **\(.inserted)건** / 갱신 \(.updated)건"' \
                "board-$key.json" >> "$GITHUB_STEP_SUMMARY"
              jq -r --arg k "$key" '.new_slugs[] | "  - `\(.)`"' "board-$key.json" >> "$GITHUB_STEP_SUMMARY"
            else
              cat "board-$key.json" || true
              echo "- m_$key 게시판 **실패**" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            echo "::endgroup::"
          done

          echo "::group::마이홈 API"
          if python -m zipgonggo_pipeline.stages.s1_collect > myhome.json; then
            cat myhome.json
            jq -r '"- 마이홈 API — 신규 **\(.inserted)건** / 갱신 \(.updated)건"' myhome.json >> "$GITHUB_STEP_SUMMARY"
          else
            cat myhome.json || true
            echo "- 마이홈 API **실패**" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          fi
          echo "::endgroup::"

          # 상세로 넘길 건 i-sh 공고뿐이다. 마이홈분(LH 전국)은 첨부 양식이 달라 S3이 못 읽는다
          slugs=$(jq -rs '[.[] | .new_slugs[]?] | join(" ")' board-247.json board-241.json 2>/dev/null || echo "")
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

  results:
    name: 경쟁률 — 결과 글 파싱
    if: ${{ !inputs.skip_results }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    outputs:
      fail: ${{ steps.r.outputs.fail }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r requirements.txt

      - name: S3-RESULT 결과 글
        id: r
        run: |
          SINCE="${{ inputs.since_year }}"
          if [ -z "$SINCE" ]; then SINCE=$(TZ=Asia/Seoul date +%Y); fi
          fail=0
          echo "## 경쟁률" >> "$GITHUB_STEP_SUMMARY"
          # 첨부를 읽는 잡이라 하루치 상한을 둔다. 밀린 건 다음 회차가 이어 받는다
          if python -m zipgonggo_pipeline.stages.s3_ish_results \
               --since-year "$SINCE" --max-pages 3 --limit 20 > results.json; then
            cat results.json
            jq -r '"- 결과 글 원장 \(.inserted + .updated)건"
                   + (if (.skipped | length) > 0 then " (건너뜀 \(.skipped))" else "" end)' \
              results.json >> "$GITHUB_STEP_SUMMARY"
          else
            cat results.json || true
            echo "- 결과 글 **실패**" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          fi
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

  detail:
    name: 상세 — 「공고 수집」에 넘김
    needs: board
    if: needs.board.outputs.slugs != ''
    runs-on: ubuntu-latest
    steps:
      # 게시판이 주워 온 신규 slug을 collect.yml에 넘긴다. force를 켜는 건 그쪽 「감시」가
      # 포털 목록에서 신규 0건을 볼 것이기 때문이다 — 그러면 상세 잡이 통째로 건너뛰어진다
      - name: workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SLUGS: ${{ needs.board.outputs.slugs }}
        run: |
          echo "넘길 slug: $SLUGS"
          gh workflow run collect.yml -R "$GITHUB_REPOSITORY" -f force=true -f slugs="$SLUGS"
          {
            echo "## 상세 요청"
            echo "「공고 수집」을 불렀다 — \`$SLUGS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 파싱이 조용히 실패하면 빈 상세 페이지가 남는다. 사람이 볼 자리를 만든다
  alert:
    name: 실패하면 이슈
    needs: [board, results, detail]
    if: always() && (failure() || needs.board.outputs.fail == '1' || needs.results.outputs.fail == '1')
    runs-on: ubuntu-latest
    steps:
      - name: 이슈 열기
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "순찰 실패 — $(date -u +%Y-%m-%d\ %H:%M)Z" \
            --label "수집" \
            --body "게시판 순찰 중 일부가 실패했다. $RUN" \
            || echo "이슈 생성 실패(라벨 없음?) — 무시"
